[workspace]
members = ["crates/needle-core", "crates/needle-wasm"]
default-members = ["crates/needle-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"
authors = ["Needle contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
